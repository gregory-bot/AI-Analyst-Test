# Render Blueprint - deploys the FastAPI backend.
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked `sync: false`
# are entered in the dashboard and never stored in git.
services:
  - type: web
    name: tms-screening-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    # Built from the repo root so the sample case-study documents (in the root)
    # are available to the "use sample documents" option.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false            # paste your key in the Render dashboard
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: ALLOWED_ORIGINS   # comma-separated frontend URLs allowed to call the API
        sync: false            # e.g. https://your-app.netlify.app,http://localhost:5173
